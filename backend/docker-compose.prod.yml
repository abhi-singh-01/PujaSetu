services:
  mongodb:
    image: mongo:7
    container_name: pujasetu-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pujasetu-api-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pujasetu
      ADVANCE_PAYMENT_PERCENT: "15"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data_prod:
