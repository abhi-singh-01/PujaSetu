# Production stack. Copy ../.env.docker.example to .env and set secrets before deploy.
#
# Self-hosted MongoDB (VPS):
#   docker compose -f docker-compose.prod.yml --profile with-db up -d --build
#
# External MongoDB (Atlas / managed):
#   Set MONGODB_URI in .env, then:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mongodb:
    profiles: ["with-db"]
    image: mongo:7
    container_name: pujasetu-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    image: pujasetu-api:latest
    container_name: pujasetu-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/pujasetu}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 characters)}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-604800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      DEV_OTP_BYPASS: "false"
      SEED_ENABLED: "false"
      ADVANCE_PAYMENT_PERCENT: ${ADVANCE_PAYMENT_PERCENT:-15}
      COMPLETION_OTP_EXPIRY_MINUTES: ${COMPLETION_OTP_EXPIRY_MINUTES:-30}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env (comma-separated origins)}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mongo_data:
