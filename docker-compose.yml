# Local / dev full stack (API + MongoDB with seed data).
# From repo root:
#   docker compose up -d --build
#
# API: http://localhost:5000/api/health
# Swagger: http://localhost:5000/swagger-ui.html

services:
  mongodb:
    image: mongo:7
    container_name: pujasetu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pujasetu-api:dev
    container_name: pujasetu-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/pujasetu
      JWT_SECRET: ${JWT_SECRET:-pujasetu-docker-dev-secret-min-32-characters-long}
      DEV_OTP_BYPASS: "true"
      DEV_OTP_CODE: "123456"
      ADVANCE_PAYMENT_PERCENT: "15"
      COMPLETION_OTP_EXPIRY_MINUTES: "30"
      SEED_ENABLED: "true"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8081,http://localhost:19006,http://10.0.2.2:8081}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mongo_data:
